<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Google Veo 3 API contract migration checkpoints</title>
  <desc id="desc">A six-step path from identifying the current product surface through request contract, access, workload testing, cost reconciliation, and reversible cutover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b33"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35c9ff"/>
      <stop offset="1" stop-color="#ffbd59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020b14" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="720" rx="34" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#8fb7d7" stroke-width="1">
    <path d="M0 120H1400M0 240H1400M0 360H1400M0 480H1400M0 600H1400"/>
    <path d="M140 0V720M280 0V720M420 0V720M560 0V720M700 0V720M840 0V720M980 0V720M1120 0V720M1260 0V720"/>
  </g>

  <text x="72" y="80" fill="#f6f2ea" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">A migration changes the full API contract</text>
  <text x="72" y="120" fill="#a9bfd2" font-family="Arial, Helvetica, sans-serif" font-size="22">The model ID is one field. Approve the route only after every checkpoint is traceable.</text>

  <path d="M155 330H1245" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round"/>
  <path d="M1230 310L1265 330L1230 350" fill="none" stroke="#ffbd59" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g transform="translate(55 190)">
      <rect width="190" height="280" rx="24" fill="#0d3556" stroke="#35c9ff" stroke-width="3"/>
      <circle cx="95" cy="140" r="42" fill="#35c9ff"/>
      <text x="95" y="151" text-anchor="middle" fill="#071b33" font-size="30" font-weight="700">1</text>
      <text x="95" y="48" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">Identify</text>
      <text x="95" y="77" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">the surface</text>
      <text x="95" y="218" text-anchor="middle" fill="#c4d7e6" font-size="17">Model ID</text>
      <text x="95" y="243" text-anchor="middle" fill="#c4d7e6" font-size="17">Base URL</text>
      <text x="95" y="268" text-anchor="middle" fill="#c4d7e6" font-size="17">Authentication</text>
    </g>

    <g transform="translate(275 190)">
      <rect width="190" height="280" rx="24" fill="#123b58" stroke="#59d7f6" stroke-width="3"/>
      <circle cx="95" cy="140" r="42" fill="#59d7f6"/>
      <text x="95" y="151" text-anchor="middle" fill="#071b33" font-size="30" font-weight="700">2</text>
      <text x="95" y="48" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">Rebuild the</text>
      <text x="95" y="77" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">API contract</text>
      <text x="95" y="218" text-anchor="middle" fill="#c4d7e6" font-size="17">Request</text>
      <text x="95" y="243" text-anchor="middle" fill="#c4d7e6" font-size="17">Completion</text>
      <text x="95" y="268" text-anchor="middle" fill="#c4d7e6" font-size="17">Output</text>
    </g>

    <g transform="translate(495 190)">
      <rect width="190" height="280" rx="24" fill="#173e55" stroke="#79dcd7" stroke-width="3"/>
      <circle cx="95" cy="140" r="42" fill="#79dcd7"/>
      <text x="95" y="151" text-anchor="middle" fill="#071b33" font-size="30" font-weight="700">3</text>
      <text x="95" y="48" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">Verify</text>
      <text x="95" y="77" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">access</text>
      <text x="95" y="218" text-anchor="middle" fill="#c4d7e6" font-size="17">Account</text>
      <text x="95" y="243" text-anchor="middle" fill="#c4d7e6" font-size="17">Region</text>
      <text x="95" y="268" text-anchor="middle" fill="#c4d7e6" font-size="17">Quota</text>
    </g>

    <g transform="translate(715 190)">
      <rect width="190" height="280" rx="24" fill="#3d4144" stroke="#d9d17d" stroke-width="3"/>
      <circle cx="95" cy="140" r="42" fill="#d9d17d"/>
      <text x="95" y="151" text-anchor="middle" fill="#071b33" font-size="30" font-weight="700">4</text>
      <text x="95" y="48" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">Test the</text>
      <text x="95" y="77" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">workload</text>
      <text x="95" y="218" text-anchor="middle" fill="#d9d9cf" font-size="17">Required inputs</text>
      <text x="95" y="243" text-anchor="middle" fill="#d9d9cf" font-size="17">Failures</text>
      <text x="95" y="268" text-anchor="middle" fill="#d9d9cf" font-size="17">Output criteria</text>
    </g>

    <g transform="translate(935 190)">
      <rect width="190" height="280" rx="24" fill="#59422f" stroke="#f0c36a" stroke-width="3"/>
      <circle cx="95" cy="140" r="42" fill="#f0c36a"/>
      <text x="95" y="151" text-anchor="middle" fill="#071b33" font-size="30" font-weight="700">5</text>
      <text x="95" y="48" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">Reconcile</text>
      <text x="95" y="77" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">cost</text>
      <text x="95" y="218" text-anchor="middle" fill="#f0dfc4" font-size="17">Price source</text>
      <text x="95" y="243" text-anchor="middle" fill="#f0dfc4" font-size="17">Usage fields</text>
      <text x="95" y="268" text-anchor="middle" fill="#f0dfc4" font-size="17">Billing terms</text>
    </g>

    <g transform="translate(1155 190)">
      <rect width="190" height="280" rx="24" fill="#664331" stroke="#ffbd59" stroke-width="3"/>
      <circle cx="95" cy="140" r="42" fill="#ffbd59"/>
      <text x="95" y="151" text-anchor="middle" fill="#071b33" font-size="30" font-weight="700">6</text>
      <text x="95" y="48" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">Cut over</text>
      <text x="95" y="77" text-anchor="middle" fill="#f6f2ea" font-size="21" font-weight="700">reversibly</text>
      <text x="95" y="218" text-anchor="middle" fill="#f5dec9" font-size="17">Adapter</text>
      <text x="95" y="243" text-anchor="middle" fill="#f5dec9" font-size="17">Feature flag</text>
      <text x="95" y="268" text-anchor="middle" fill="#f5dec9" font-size="17">Rollback</text>
    </g>
  </g>

  <rect x="195" y="555" width="1010" height="90" rx="22" fill="#081624" stroke="#486680" stroke-width="2"/>
  <text x="700" y="592" text-anchor="middle" fill="#f6f2ea" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">GO / NO-GO</text>
  <text x="700" y="624" text-anchor="middle" fill="#b9cada" font-family="Arial, Helvetica, sans-serif" font-size="19">Approve only when every critical result can be explained from request through output, cost, and rollback.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">Google Veo 3 API contract migration checkpoints for narrow screens</title>
  <desc id="desc">Six numbered migration checkpoints arranged in two columns: identify the surface, rebuild the API contract, verify access, test the workload, reconcile cost, and cut over reversibly.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b33"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020b14" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="720" height="1080" rx="28" fill="url(#bg)"/>
  <g opacity="0.13" stroke="#8fb7d7" stroke-width="1">
    <path d="M0 135H720M0 270H720M0 405H720M0 540H720M0 675H720M0 810H720M0 945H720"/>
    <path d="M120 0V1080M240 0V1080M360 0V1080M480 0V1080M600 0V1080"/>
  </g>

  <text x="36" y="66" fill="#f6f2ea" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">The full API contract changes</text>
  <text x="36" y="105" fill="#a9bfd2" font-family="Arial, Helvetica, sans-serif" font-size="20">Approve the route only after all six checkpoints.</text>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g transform="translate(36 155)">
      <rect width="306" height="220" rx="22" fill="#0d3556" stroke="#35c9ff" stroke-width="3"/>
      <circle cx="48" cy="52" r="28" fill="#35c9ff"/>
      <text x="48" y="62" text-anchor="middle" fill="#071b33" font-size="27" font-weight="700">1</text>
      <text x="88" y="45" fill="#f6f2ea" font-size="23" font-weight="700">Identify the</text>
      <text x="88" y="73" fill="#f6f2ea" font-size="23" font-weight="700">surface</text>
      <text x="30" y="130" fill="#c4d7e6" font-size="18">Model ID</text>
      <text x="30" y="162" fill="#c4d7e6" font-size="18">Base URL</text>
      <text x="30" y="194" fill="#c4d7e6" font-size="18">Authentication</text>
    </g>
    <g transform="translate(378 155)">
      <rect width="306" height="220" rx="22" fill="#123b58" stroke="#59d7f6" stroke-width="3"/>
      <circle cx="48" cy="52" r="28" fill="#59d7f6"/>
      <text x="48" y="62" text-anchor="middle" fill="#071b33" font-size="27" font-weight="700">2</text>
      <text x="88" y="45" fill="#f6f2ea" font-size="23" font-weight="700">Rebuild the</text>
      <text x="88" y="73" fill="#f6f2ea" font-size="23" font-weight="700">API contract</text>
      <text x="30" y="130" fill="#c4d7e6" font-size="18">Request</text>
      <text x="30" y="162" fill="#c4d7e6" font-size="18">Completion</text>
      <text x="30" y="194" fill="#c4d7e6" font-size="18">Output</text>
    </g>
    <g transform="translate(36 405)">
      <rect width="306" height="220" rx="22" fill="#173e55" stroke="#79dcd7" stroke-width="3"/>
      <circle cx="48" cy="52" r="28" fill="#79dcd7"/>
      <text x="48" y="62" text-anchor="middle" fill="#071b33" font-size="27" font-weight="700">3</text>
      <text x="88" y="45" fill="#f6f2ea" font-size="23" font-weight="700">Verify</text>
      <text x="88" y="73" fill="#f6f2ea" font-size="23" font-weight="700">access</text>
      <text x="30" y="130" fill="#c4d7e6" font-size="18">Account</text>
      <text x="30" y="162" fill="#c4d7e6" font-size="18">Region</text>
      <text x="30" y="194" fill="#c4d7e6" font-size="18">Quota</text>
    </g>
    <g transform="translate(378 405)">
      <rect width="306" height="220" rx="22" fill="#3d4144" stroke="#d9d17d" stroke-width="3"/>
      <circle cx="48" cy="52" r="28" fill="#d9d17d"/>
      <text x="48" y="62" text-anchor="middle" fill="#071b33" font-size="27" font-weight="700">4</text>
      <text x="88" y="45" fill="#f6f2ea" font-size="23" font-weight="700">Test the</text>
      <text x="88" y="73" fill="#f6f2ea" font-size="23" font-weight="700">workload</text>
      <text x="30" y="130" fill="#d9d9cf" font-size="18">Required inputs</text>
      <text x="30" y="162" fill="#d9d9cf" font-size="18">Failures</text>
      <text x="30" y="194" fill="#d9d9cf" font-size="18">Output criteria</text>
    </g>
    <g transform="translate(36 655)">
      <rect width="306" height="220" rx="22" fill="#59422f" stroke="#f0c36a" stroke-width="3"/>
      <circle cx="48" cy="52" r="28" fill="#f0c36a"/>
      <text x="48" y="62" text-anchor="middle" fill="#071b33" font-size="27" font-weight="700">5</text>
      <text x="88" y="45" fill="#f6f2ea" font-size="23" font-weight="700">Reconcile</text>
      <text x="88" y="73" fill="#f6f2ea" font-size="23" font-weight="700">cost</text>
      <text x="30" y="130" fill="#f0dfc4" font-size="18">Price source</text>
      <text x="30" y="162" fill="#f0dfc4" font-size="18">Usage fields</text>
      <text x="30" y="194" fill="#f0dfc4" font-size="18">Billing terms</text>
    </g>
    <g transform="translate(378 655)">
      <rect width="306" height="220" rx="22" fill="#664331" stroke="#ffbd59" stroke-width="3"/>
      <circle cx="48" cy="52" r="28" fill="#ffbd59"/>
      <text x="48" y="62" text-anchor="middle" fill="#071b33" font-size="27" font-weight="700">6</text>
      <text x="88" y="45" fill="#f6f2ea" font-size="23" font-weight="700">Cut over</text>
      <text x="88" y="73" fill="#f6f2ea" font-size="23" font-weight="700">reversibly</text>
      <text x="30" y="130" fill="#f5dec9" font-size="18">Adapter</text>
      <text x="30" y="162" fill="#f5dec9" font-size="18">Feature flag</text>
      <text x="30" y="194" fill="#f5dec9" font-size="18">Rollback</text>
    </g>
  </g>

  <rect x="56" y="930" width="608" height="100" rx="22" fill="#081624" stroke="#486680" stroke-width="2"/>
  <text x="360" y="971" text-anchor="middle" fill="#f6f2ea" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">GO / NO-GO</text>
  <text x="360" y="1005" text-anchor="middle" fill="#b9cada" font-family="Arial, Helvetica, sans-serif" font-size="18">Explain every critical result from request to rollback.</text>
</svg>
